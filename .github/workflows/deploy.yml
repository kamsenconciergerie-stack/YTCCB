name: Deploy to Railway

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 6279d3ea-3d8a-46ef-b1b3-82b7005a0313
          RAILWAY_SERVICE_ID: 75ea2e9e-cae9-4e95-9782-11f884e43c19
          RAILWAY_ENVIRONMENT_ID: ddc3ed3c-876d-457d-833a-8b0e727fc900
